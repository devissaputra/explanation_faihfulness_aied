<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Explanation faithfulness architecture</title>
<desc id="desc">Synthetic probability traces and supplied feature sets are evaluated with comprehensiveness, sufficiency gap, random-removal comparison, and top-feature stability.</desc>
<rect width="1200" height="675" fill="#f8fafc"/>
<text x="60" y="78" font-family="Arial" font-size="38" font-weight="700" fill="#0f172a">Explanation Faithfulness for AIED · implemented architecture</text>
<text x="60" y="116" font-family="Arial" font-size="20" fill="#64748b">Model-agnostic metrics on synthetic probability traces</text>
<g font-family="Arial" text-anchor="middle">
<rect x="55" y="215" width="210" height="150" rx="18" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><text x="160" y="260" font-size="20" font-weight="700" fill="#1e3a8a">Prediction trace</text><text x="160" y="300" font-size="17" fill="#334155">p(original)</text><text x="160" y="328" font-size="17" fill="#334155">top-feature sets</text>
<rect x="320" y="215" width="240" height="150" rx="18" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/><text x="440" y="250" font-size="20" font-weight="700" fill="#166534">Removal / sufficiency</text><text x="440" y="292" font-size="17" fill="#334155">without top evidence</text><text x="440" y="320" font-size="17" fill="#334155">top evidence only</text>
<rect x="615" y="215" width="230" height="150" rx="18" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/><text x="730" y="250" font-size="20" font-weight="700" fill="#155e75">Stability check</text><text x="730" y="292" font-size="17" fill="#334155">Jaccard overlap</text><text x="730" y="320" font-size="17" fill="#334155">after perturbation</text>
<rect x="900" y="215" width="240" height="150" rx="18" fill="#f3e8ff" stroke="#c084fc" stroke-width="2"/><text x="1020" y="250" font-size="20" font-weight="700" fill="#6b21a8">Metric report</text><text x="1020" y="292" font-size="17" fill="#334155">comp · sufficiency</text><text x="1020" y="320" font-size="17" fill="#334155">stability · baseline delta</text>
</g>
<g stroke="#64748b" stroke-width="4"><path d="M265 290H320"/><path d="M560 290H615"/><path d="M845 290H900"/></g>
<rect x="150" y="455" width="900" height="120" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="600" y="500" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#0f172a">Interpretation boundary</text>
<text x="600" y="538" text-anchor="middle" font-family="Arial" font-size="19" fill="#475569">These metrics test supplied traces; they do not measure persuasiveness, human usefulness, or real-world trust.</text>
</svg>