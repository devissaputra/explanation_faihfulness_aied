<rect x="60" y="145" width="500" height="125" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="90" y="185" font-size="21" font-weight="700" fill="#2563eb">RQ1</text><text x="90" y="225" font-size="19" fill="#334155">Does removing top evidence change the prediction?</text>
