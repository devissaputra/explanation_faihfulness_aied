<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Explanation faithfulness evaluation pipeline</title>
<desc id="desc">Prediction traces are combined with supplied attribution sets, removal/top-only perturbations, and perturbed feature sets to compute faithfulness metrics and a transparent composite index.</desc>
<rect width="1200" height="675" fill="#f8fafc"/>
<text x="60" y="78" font-family="Arial" font-size="38" font-weight="700" fill="#0f172a">Explanation-faithfulness evaluation pipeline</text>
<text x="60" y="116" font-family="Arial" font-size="20" fill="#64748b">Implemented synthetic baseline</text>
<g font-family="Arial" text-anchor="middle">
<rect x="35" y="220" width="200" height="150" rx="18" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><text x="135" y="270" font-size="20" font-weight="700" fill="#1e3a8a">1. Prediction</text><text x="135" y="308" font-size="17" fill="#334155">original probability</text>
<rect x="270" y="220" width="200" height="150" rx="18" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/><text x="370" y="270" font-size="20" font-weight="700" fill="#166534">2. Attribution</text><text x="370" y="308" font-size="17" fill="#334155">supplied top features</text>
<rect x="505" y="220" width="200" height="150" rx="18" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/><text x="605" y="270" font-size="20" font-weight="700" fill="#155e75">3. Perturb</text><text x="605" y="303" font-size="17" fill="#334155">remove / retain</text><text x="605" y="330" font-size="17" fill="#334155">top evidence</text>
<rect x="740" y="220" width="200" height="150" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="840" y="270" font-size="20" font-weight="700" fill="#9a3412">4. Metrics</text><text x="840" y="303" font-size="17" fill="#334155">comp · sufficiency</text><text x="840" y="330" font-size="17" fill="#334155">random delta</text>
<rect x="975" y="220" width="190" height="150" rx="18" fill="#f3e8ff" stroke="#c084fc" stroke-width="2"/><text x="1070" y="270" font-size="20" font-weight="700" fill="#6b21a8">5. Stability</text><text x="1070" y="308" font-size="17" fill="#334155">top-set Jaccard</text>
</g>
<g stroke="#64748b" stroke-width="4"><path d="M235 295H270"/><path d="M470 295H505"/><path d="M705 295H740"/><path d="M940 295H975"/></g>
<rect x="145" y="455" width="910" height="115" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="600" y="500" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#0f172a">What this pipeline does not test</text>
<text x="600" y="536" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">Persuasiveness, educator usefulness, learner understanding, or production-model validity.</text>
</svg>