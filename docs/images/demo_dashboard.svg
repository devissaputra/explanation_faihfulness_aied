<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Synthetic explanation-faithfulness metrics</title>
<desc id="desc">Synthetic demonstration values for comprehensiveness, sufficiency gap, stability Jaccard, and the repository's transparent composite faithfulness index.</desc>
<rect width="1200" height="675" fill="#f8fafc"/>
<text x="60" y="78" font-family="Arial" font-size="38" font-weight="700" fill="#0f172a">Synthetic explanation-faithfulness metrics</text>
<text x="60" y="116" font-family="Arial" font-size="20" fill="#64748b">Bundled demonstration output · not human-subject evidence</text>
<g font-family="Arial">
<rect x="60" y="180" width="250" height="210" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="90" y="230" font-size="19" fill="#475569">Comprehensiveness</text><text x="90" y="320" font-size="58" font-weight="700" fill="#0f172a">0.197</text>
<rect x="340" y="180" width="250" height="210" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="370" y="230" font-size="19" fill="#475569">Sufficiency gap</text><text x="370" y="320" font-size="58" font-weight="700" fill="#0f172a">0.074</text>
<rect x="620" y="180" width="250" height="210" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="650" y="230" font-size="19" fill="#475569">Stability Jaccard</text><text x="650" y="320" font-size="58" font-weight="700" fill="#0f172a">0.837</text>
<rect x="900" y="180" width="240" height="210" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="930" y="230" font-size="19" fill="#475569">Composite index</text><text x="930" y="320" font-size="58" font-weight="700" fill="#0f172a">0.562</text>
</g>
<rect x="130" y="470" width="940" height="105" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="600" y="515" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#0f172a">Synthetic software demonstration</text>
<text x="600" y="548" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">The values do not establish explanation persuasiveness, usefulness, or trustworthiness for people.</text>
</svg>